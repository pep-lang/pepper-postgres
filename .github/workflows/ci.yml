# Tests the package on each push to main and each pull request, and on a
# vX.Y.Z tag also publishes a GitHub release for that tag. Runs on
# GitHub-hosted runners with the newest published Pepper toolchain,
# installed with pep-lang/pepper's install scripts as a user installs it.
#
# Release: set `version` in pep.toml, merge, then
#   git tag v1.0.0 && git push origin v1.0.0
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # A PostgreSQL server for the integration tests, on Linux only (service
    # containers need a Linux runner); an empty image starts none, and the
    # integration tests then return without checking anything.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-24.04' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: pepper
          POSTGRES_PASSWORD: pepper
          POSTGRES_DB: pepper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pepper"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Pepper (Unix)
        if: runner.os != 'Windows'
        # The installer lists releases through the API; unauthenticated, macOS runners hit its rate limit (403).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/pep-lang/pepper/main/scripts/install.sh | sh
          echo "$HOME/.pepper/bin" >> "$GITHUB_PATH"

      - name: Install Pepper (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/pep-lang/pepper/main/scripts/install.ps1 | iex
          "$env:LOCALAPPDATA\pepper\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Turns on TLS with a throwaway CA, so the TLS tests run too.
      - name: Set up PostgreSQL (Linux)
        if: runner.os == 'Linux'
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euxo pipefail
          bash tests/setup-postgres.sh "$CONTAINER" pepper "$RUNNER_TEMP/postgres"
          echo "PEPPER_POSTGRES_URL=postgres://pepper:pepper@localhost:5432/pepper" >> "$GITHUB_ENV"
          echo "PEPPER_POSTGRES_CA=$RUNNER_TEMP/postgres/ca.pem" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: bash tests/run.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match pep.toml's version, so a release never names a
      # version its manifest doesn't.
      - name: Check the version
        run: |
          set -euo pipefail
          want="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pep.toml | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but pep.toml says $want"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
